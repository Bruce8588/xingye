<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案二 · 沉思风</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #14130f;
      color: #a09880;
      font-family: "ZCOOL XiaoWei", "Noto Serif SC", serif;
      min-height: 100vh;
    }
    .page { max-width: 620px; margin: 0 auto; padding: 100px 32px 120px; }
    .header { margin-bottom: 80px; text-align: center; }
    .header-deco {
      width: 1px;
      height: 60px;
      background: linear-gradient(to bottom, transparent, #4a4535, transparent);
      margin: 0 auto 40px;
    }
    .header-title {
      font-family: "ZCOOL XiaoWei", serif;
      font-size: 36px;
      color: #c8b89a;
      letter-spacing: 12px;
      margin-bottom: 20px;
    }
    .header-sub {
      font-size: 12px;
      color: #5a5040;
      letter-spacing: 3px;
    }
    .card {
      background: linear-gradient(135deg, #1c1a14 0%, #18160f 100%);
      border: 1px solid #2a2618;
      border-radius: 4px;
      padding: 40px 36px;
      margin-bottom: 20px;
      cursor: pointer;
      position: relative;
      transition: border-color 0.3s;
    }
    .card::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, transparent, #4a3f28, transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card:hover { border-color: #3a3520; }
    .card:hover::before { opacity: 1; }
    .card-name { font-size: 22px; color: #c8b890; margin-bottom: 8px; letter-spacing: 2px; }
    .card-type { font-size: 11px; color: #4a4530; letter-spacing: 3px; margin-bottom: 24px; }
    .card-quote { font-size: 14px; color: #706850; line-height: 2.2; font-style: italic; }
    .card-quote::before { content: '"'; }
    .card-quote::after { content: '"'; }
    .detail { display: none; }
    .detail.active { display: block; }
    .list-view { display: block; }
    .list-view.hidden { display: none; }
    .back-link { display: inline-block; font-size: 12px; color: #4a4530; text-decoration: none; margin-bottom: 60px; letter-spacing: 2px; cursor: pointer; transition: color 0.2s; }
    .back-link:hover { color: #8a7a60; }
    .detail-name { font-family: "ZCOOL XiaoWei", serif; font-size: 44px; color: #c8b890; letter-spacing: 6px; margin-bottom: 6px; text-align: center; }
    .detail-type { text-align: center; font-size: 11px; color: #4a4530; letter-spacing: 4px; margin-bottom: 60px; }
    .detail-section { margin-bottom: 56px; }
    .detail-section-label { text-align: center; font-size: 11px; color: #3a3520; letter-spacing: 4px; margin-bottom: 28px; }
    .detail-text { font-size: 14px; color: #8a7a60; line-height: 2.6; text-align: center; }
    .detail-text p { margin-bottom: 20px; }
    .glow-line { width: 60px; height: 1px; background: linear-gradient(to right, transparent, #4a3f28, transparent); margin: 0 auto 60px; }
    .fab { position: fixed; bottom: 48px; right: 48px; width: 44px; height: 44px; background: transparent; border: 1px solid #3a3520; color: #4a3f28; border-radius: 50%; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.3s; }
    .fab:hover { border-color: #6a5a40; color: #8a7a60; background: #1a1810; }
  </style>
</head>
<body>
  <div class="page">
    <div class="list-view" id="listView">
      <div class="header">
        <div class="header-deco"></div>
        <h1 class="header-title">心影</h1>
        <p class="header-sub">探索内在的轮廓</p>
      </div>
      <div class="card" onclick="showDetail(0)">
        <div class="card-name">心影一号</div>
        <div class="card-type">INTJ</div>
        <p class="card-quote">冷静理性，善于从宏观构建体系。习惯用战略视角审视问题，对效率有近乎苛刻的追求。</p>
      </div>
      <div class="card" onclick="showDetail(1)">
        <div class="card-name">高敏感</div>
        <div class="card-type">HSP</div>
        <p class="card-quote">对环境细节有极高的感知力，能够捕捉到他人忽略的微妙变化。情感体验深刻而复杂，共情能力极强。</p>
      </div>
      <div class="card" onclick="showDetail(2)">
        <div class="card-name">理性派</div>
        <div class="card-type">ESTP</div>
        <p class="card-quote">务实主义者，擅长在复杂局面中找到最直接的解决路径。行动力强，偏好即兴发挥而非过度规划。</p>
      </div>
    </div>
    <div class="detail" id="detailView">
      <span class="back-link" onclick="showList()">返回列表</span>
      <div id="detailContent"></div>
    </div>
  </div>
  <button class="fab">+</button>
  <script>
    const data = [
      { name: '心影一号', type: 'INTJ', traits: '冷静理性，善于从宏观构建体系。习惯用战略视角审视问题，对效率有近乎苛刻的追求。不轻易外露情绪，但内心有强烈的价值判断标准。\n\n擅长抽象分析，能在信息残缺时仍构建出自洽的逻辑框架。对愚蠢缺乏耐心，尤其无法忍受逻辑混乱的讨论。', tools: '第一性原理\n俯视分析法\n逆向思维\n长期主义' },
      { name: '高敏感', type: 'HSP', traits: '对环境细节有极高的感知力，能够捕捉到他人忽略的微妙变化。情感体验深刻而复杂，共情能力极强，但也容易受到外部情绪的干扰。\n\n在安静的环境中创造力最强，嘈杂会使其迅速耗能。习惯深度独处，从内省中获取能量。', tools: '情绪记录法\n场景切换\n边界建立' },
      { name: '理性派', type: 'ESTP', traits: '务实主义者，擅长在复杂局面中找到最直接的解决路径。行动力强，偏好即兴发挥而非过度规划。对风险有敏锐嗅觉。\n\n不惧怕冲突，甚至在冲突中能保持异常清醒。社交能力强，能够快速与陌生人建立联系。', tools: '成本收益分析\n压力测试\n快速迭代' }
    ];
    function showDetail(idx) {
      const d = data[idx];
      document.getElementById('detailContent').innerHTML = '<div class="detail-name">'+d.name+'</div><div class="detail-type">'+d.type+'</div><div class="glow-line"></div><div class="detail-section"><div class="detail-section-label">特 质</div><div class="detail-text"><p>'+d.traits.replace(/\n/g, '</p><p>')+'</p></div></div><div class="detail-section"><div class="detail-section-label">工 具</div><div class="detail-text"><p>'+d.tools.replace(/\n/g, '</p><p>')+'</p></div></div>';
      document.getElementById('listView').classList.add('hidden');
      document.getElementById('detailView').classList.add('active');
      window.scrollTo(0, 0);
    }
    function showList() {
      document.getElementById('listView').classList.remove('hidden');
      document.getElementById('detailView').classList.remove('active');
    }
  </script>
</body>
</html>
